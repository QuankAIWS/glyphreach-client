name: Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glyphreach-client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Public client build and browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify required ownership and policy files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md LICENSE NOTICE CONTRIBUTING.md SECURITY.md AGENTS.md .github/CODEOWNERS; do
            test -f "$file" || { echo "missing required file: $file" >&2; exit 1; }
          done
          grep -Fq 'publicly viewable proprietary software' README.md
          grep -Fq 'Copyright © 2026 QuankAIWS' LICENSE

      - name: Enforce public-runner policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.yml' --include='*.yaml' -E '^[[:space:]]*runs-on:.*self-hosted' .github/workflows; then
            echo 'Public GlyphReach client workflows must not target the private self-hosted runner.' >&2
            exit 1
          fi
          if grep -RIn --include='*.yml' --include='*.yaml' -E '^[[:space:]]*pull_request_target:' .github/workflows; then
            echo 'pull_request_target is forbidden by default in the public client.' >&2
            exit 1
          fi

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo 'tracked environment secret file detected' >&2
            exit 1
          fi
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ':!*.md' ':!LICENSE' ':!NOTICE'; then
            echo 'private-key material appears to be committed' >&2
            exit 1
          fi

      - name: Verify hosted Node runtime
        shell: bash
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build client
        env:
          VITE_GLYPHREACH_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke and visual capture
        run: npm run test:e2e

      - name: Emit world-first screenshot for visual review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          image=test-results/world-first-home.png
          if [[ ! -f "$image" ]]; then
            echo "visual capture not produced: $image"
            exit 0
          fi
          echo "GLYPHREACH_SCREENSHOT_BYTES=$(wc -c < "$image")"
          echo 'GLYPHREACH_SCREENSHOT_BASE64_BEGIN'
          base64 -w 0 "$image"
          echo
          echo 'GLYPHREACH_SCREENSHOT_BASE64_END'
