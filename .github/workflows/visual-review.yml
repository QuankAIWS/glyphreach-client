name: Visual Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glyphreach-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture player-facing shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build client
        env:
          VITE_GLYPHREACH_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture world-first shell
        run: npx playwright test test/world-first-visual.spec.ts

      - name: Emit screenshot for visual review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          image=test-results/world-first-home.jpg
          if [[ ! -f "$image" ]]; then
            echo "visual capture not produced: $image"
            exit 0
          fi
          echo "GLYPHREACH_SCREENSHOT_BYTES=$(wc -c < "$image")"
          echo 'GLYPHREACH_SCREENSHOT_BASE64_BEGIN'
          base64 -w 0 "$image"
          echo
          echo 'GLYPHREACH_SCREENSHOT_BASE64_END'
