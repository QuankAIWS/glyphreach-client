name: Visual Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glyphreach-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture player-facing shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build client
        env:
          VITE_GLYPHREACH_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture world-first shell
        run: npx playwright test test/world-first-visual.spec.ts

      - name: Upload visual review capture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glyphreach-world-first
          path: test-results/world-first-home.jpg
          if-no-files-found: warn
          retention-days: 7
